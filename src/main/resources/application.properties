spring.application.name=minirag

# -------------------------------------------------
# SERVIDOR
# -------------------------------------------------
server.port=8080

# -------------------------------------------------
# GROQ (API compatible con OpenAI)
# La clave se lee de la variable de entorno GROQ_API_KEY
# -------------------------------------------------
spring.ai.model.chat=openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.2

# -------------------------------------------------
# EMBEDDINGS LOCALES (Transformers ONNX - intfloat/e5-small-v2)
# -------------------------------------------------
spring.ai.model.embedding=transformers
spring.ai.embedding.transformer.tokenizer.uri=https://huggingface.co/intfloat/e5-small-v2/raw/main/tokenizer.json
spring.ai.embedding.transformer.onnx.model-uri=https://huggingface.co/intfloat/e5-small-v2/resolve/main/model.onnx
spring.ai.embedding.transformer.tokenizer.options.padding=true

# -------------------------------------------------
# H2
# -------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/miniragdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# -------------------------------------------------
# CONSOLA H2
# -------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
